<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belladonna Audio Alchemies — Tonight's Lineup</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C97A;
    --gold-dim: #8B6B2A;
    --ink: #0E0C0A;
    --surface: #1A1610;
    --surface2: #201C16;
    --border: rgba(201,168,76,0.2);
    --border-strong: rgba(201,168,76,0.4);
    --text: #E8DFC8;
    --text-muted: #9E8E6A;
    --text-dim: #6A5E42;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'Crimson Text', serif;
    font-size: 17px;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(201,168,76,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(201,168,76,0.03) 0%, transparent 60%);
  }

  /* HEADER */
  .site-header {
    border-bottom: 1px solid var(--border-strong);
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(14,12,10,0.9);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo-img { width: 44px; height: 44px; object-fit: contain; }
  .header-text { line-height: 1.25; }
  .header-title {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.08em;
  }
  .header-sub {
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* MAIN */
  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 2rem;
  }

  /* LOADING */
  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6rem 2rem;
    gap: 1rem;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* EMPTY */
  #empty {
    display: none;
    text-align: center;
    padding: 6rem 2rem;
    color: var(--text-dim);
  }
  #empty h2 {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }

  /* NIGHTS GRID */
  #nights-grid {
    display: none;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.5rem;
  }

  /* NIGHT CARD */
  .night-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    cursor: pointer;
  }
  .night-card:hover {
    border-color: var(--border-strong);
    transform: translateY(-2px);
  }

  .night-banner {
    aspect-ratio: 4 / 5;
    width: 100%;
    background: var(--surface2);
    position: relative;
    overflow: hidden;
  }
  .night-banner img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .night-info {
    padding: 1rem 1.2rem 1.2rem;
  }
  .night-name {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-light);
    margin-bottom: 0.6rem;
    line-height: 1.3;
  }
  .night-cats {
    font-size: 0.88rem;
    color: var(--text-muted);
    line-height: 1.7;
  }
  .night-cats span {
    display: block;
    padding: 0.25rem 0;
    border-bottom: 1px solid var(--border);
  }
  .night-cats span:last-child { border-bottom: none; }

  /* DETAIL OVERLAY */
  .detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.82);
    z-index: 200;
    overflow-y: auto;
    padding: 2rem 1rem;
  }
  .detail-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
  .detail-panel {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    width: 100%;
    max-width: 560px;
    overflow: hidden;
  }
  .detail-banner {
    aspect-ratio: 4 / 5;
    width: 100%;
    background: var(--surface2);
    position: relative;
    overflow: hidden;
  }
  .detail-banner img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .detail-body { padding: 1.5rem; }
  .detail-name {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--gold-light);
    margin-bottom: 1.2rem;
    line-height: 1.3;
  }
  .detail-section-label {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .detail-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .detail-cats {
    margin-bottom: 1.25rem;
  }
  .detail-cat-item {
    padding: 0.45rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
    color: var(--text-muted);
  }
  .detail-cat-item:last-child { border-bottom: none; }
  .detail-enhancements { margin-bottom: 1rem; }
  .detail-enhance-item {
    display: flex;
    gap: 10px;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
    color: var(--text);
  }
  .detail-enhance-item:last-child { border-bottom: none; }
  .detail-enhance-item::before {
    content: '✦';
    color: var(--gold-dim);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .close-btn {
    display: block;
    width: 100%;
    padding: 0.8rem;
    background: none;
    border: none;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
  }
  .close-btn:hover { color: var(--gold); background: rgba(201,168,76,0.05); }

  /* FOOTER */
  .site-footer {
    text-align: center;
    padding: 2rem;
    color: var(--text-dim);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: 'Cinzel', serif;
    border-top: 1px solid var(--border);
    margin-top: 3rem;
  }

  @media (max-width: 600px) {
    .site-header { padding: 1rem; }
    .main { padding: 1.5rem 1rem; }
    #nights-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
  }
</style>
</head>
<body>

<header class="site-header">
  <img src="logo.png" alt="Belladonna" class="logo-img">
  <div class="header-text">
    <div class="header-title">Belladonna Audio Alchemies</div>
    <div class="header-sub">Tonight's Lineup</div>
  </div>
</header>

<main class="main">
  <div id="loading">
    <div class="spinner"></div>
    <p>Summoning the lineup…</p>
  </div>
  <div id="empty">
    <h2>Nothing Published Yet</h2>
    <p>Check back soon.</p>
  </div>
  <div id="nights-grid"></div>
</main>

<!-- DETAIL OVERLAY -->
<div class="detail-overlay" id="detail-overlay" onclick="handleOverlayClick(event)">
  <div class="detail-panel" id="detail-panel">
    <div class="detail-banner" id="detail-banner"></div>
    <div class="detail-body">
      <div class="detail-name" id="detail-name"></div>
      <div id="detail-tags" style="display:none; gap:5px; flex-wrap:wrap; margin-bottom:0.75rem;"></div>
      <div id="detail-description-section" style="display:none; margin-bottom:1.25rem;">
        <p id="detail-description" style="font-size:1rem; color:var(--text-muted); line-height:1.7; font-style:italic;"></p>
      </div>
      <div id="detail-cats-section">
        <div class="detail-section-label">Categories</div>
        <div class="detail-cats" id="detail-cats"></div>
      </div>
      <div id="detail-enhancements-section" style="display:none;">
        <div class="detail-section-label">Night Enhancements</div>
        <div class="detail-enhancements" id="detail-enhancements"></div>
      </div>
    </div>
    <button class="close-btn" onclick="closeDetail()">Close</button>
  </div>
</div>

<!-- MINI GAMES SECTION -->
<section id="minigames-section" style="display:none; max-width:1100px; margin:0 auto; padding:0 2rem 3rem;">
  <div style="border-top:1px solid rgba(201,168,76,0.2); margin-bottom:2rem; padding-top:2.5rem; display:flex; align-items:center; gap:12px;">
    <span style="font-family:'Cinzel',serif; font-size:0.75rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold);">Mini Games</span>
    <div style="flex:1; height:1px; background:rgba(201,168,76,0.2);"></div>
  </div>
  <div id="minigames-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:1.25rem;"></div>
</section>

<footer class="site-footer">Belladonna Audio Alchemies &nbsp;✦&nbsp; Seattle–Tacoma</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQUq6wKgBHIfaVCjxOXa7fpsJ0qmTocqI",
  authDomain: "belladonnabrainstormtool.firebaseapp.com",
  projectId: "belladonnabrainstormtool",
  storageBucket: "belladonnabrainstormtool.firebasestorage.app",
  messagingSenderId: "981934324501",
  appId: "1:981934324501:web:9ba85ffde67d2d2b95c71c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let publishedNights = [];

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function load() {
  try {
    const snap = await getDocs(collection(db, 'nights'));
    publishedNights = snap.docs
      .map(d => ({ _id: d.id, ...d.data() }))
      .filter(n => n.published);
  } catch(e) {
    console.error(e);
  }

  document.getElementById('loading').style.display = 'none';

  // Load mini games (published categories with mini game type)
  try {
    const cSnap = await getDocs(collection(db, 'categories'));
    const miniGames = cSnap.docs
      .map(d => ({ _id: d.id, ...d.data() }))
      .filter(c => c.published && (c.type||'').toLowerCase().includes('mini'))
      .sort((a,b) => (a.position??9999) - (b.position??9999));
    renderMiniGames(miniGames);
  } catch(e) { console.error('Mini games load error:', e); }

  if (!publishedNights.length) {
    document.getElementById('empty').style.display = 'block';
    return;
  }

  const grid = document.getElementById('nights-grid');
  grid.style.display = 'grid';
  grid.innerHTML = publishedNights.map((n, i) => {
    const bgColor = n.bannerColor ? `background:${n.bannerColor};` : '';
    const bannerImg = n.bannerData
      ? `<img src="${n.bannerData}" alt="${esc(n.name)}">`
      : '';
    return `<div class="night-card" onclick="openDetail(${i})">
      <div class="night-banner" style="${bgColor}">
        ${bannerImg}
      </div>
      <div class="night-info">
        <div class="night-name">${esc(n.name)}</div>
      </div>
    </div>`;
  }).join('');
}

function openDetail(i) {
  const n = publishedNights[i];

  // Banner
  const bannerEl = document.getElementById('detail-banner');
  const bgColor = n.bannerColor ? `background:${n.bannerColor};` : '';
  bannerEl.style.cssText = bgColor;
  bannerEl.innerHTML = n.bannerData ? `<img src="${n.bannerData}" alt="${esc(n.name)}">` : '';

  // Name
  document.getElementById('detail-name').textContent = n.name;

  // Tags
  const tagsEl = document.getElementById('detail-tags');
  const tags = n.nightTagsList || [];
  if (tags.length && tagsEl) {
    tagsEl.innerHTML = tags.map(t => `<span style="background:rgba(60,80,100,0.25);color:#9BB8D4;border:1px solid rgba(100,140,180,0.2);font-size:0.7rem;padding:2px 9px;border-radius:3px;font-family:'Cinzel',serif;letter-spacing:0.06em;">${esc(t)}</span>`).join('');
    tagsEl.style.display = 'flex';
  } else if (tagsEl) {
    tagsEl.style.display = 'none';
  }

  // Description
  const descSection = document.getElementById('detail-description-section');
  const descEl = document.getElementById('detail-description');
  if (n.description) {
    descEl.textContent = n.description;
    descSection.style.display = 'block';
  } else {
    descSection.style.display = 'none';
  }

  // Categories
  const cats = n.categoryIds || [];
  document.getElementById('detail-cats').innerHTML = cats.length
    ? cats.map(id => `<div class="detail-cat-item">${esc(id)}</div>`).join('')
    : `<div class="detail-cat-item" style="color:var(--text-dim); font-style:italic;">No categories listed</div>`;

  // Enhancements
  const enhancements = n.enhancements || [];
  const enhSection = document.getElementById('detail-enhancements-section');
  if (enhancements.length) {
    document.getElementById('detail-enhancements').innerHTML =
      enhancements.map(e => `<div class="detail-enhance-item">${esc(e)}</div>`).join('');
    enhSection.style.display = 'block';
  } else {
    enhSection.style.display = 'none';
  }

  document.getElementById('detail-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderMiniGames(games) {
  const section = document.getElementById('minigames-section');
  const grid = document.getElementById('minigames-grid');
  if (!games.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  grid.innerHTML = games.map((c, i) => {
    const bannerHtml = c.bannerData
      ? `<img src="${c.bannerData}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" alt="${esc(c.name)}">`
      : '';
    return `<div class="night-card" onclick="openMiniDetail(${i})" data-mini="${i}">
      <div class="night-banner" style="background:var(--surface2);">
        ${bannerHtml}
      </div>
      <div class="night-info">
        <div class="night-name">${esc(c.name)}</div>
        ${c.theme ? `<p style="font-size:0.85rem;color:var(--text-muted);font-weight:600;margin-bottom:0.25rem;">${esc(c.theme)}</p>` : ''}
        ${(c.tags||'').split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span style="background:rgba(60,80,100,0.25);color:#9BB8D4;border:1px solid rgba(100,140,180,0.2);font-size:0.65rem;padding:2px 8px;border-radius:3px;font-family:'Cinzel',serif;letter-spacing:0.06em;margin-right:4px;">${esc(t)}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
  window._miniGames = games;
}

function openMiniDetail(i) {
  const c = window._miniGames[i];
  document.getElementById('detail-banner').innerHTML = c.bannerData ? `<img src="${c.bannerData}" alt="${esc(c.name)}">` : '';
  document.getElementById('detail-banner').style.background = 'var(--surface2)';
  document.getElementById('detail-name').textContent = c.name;

  const descSection = document.getElementById('detail-description-section');
  const descEl = document.getElementById('detail-description');
  if (c.notes) { descEl.textContent = c.notes; descSection.style.display = 'block'; }
  else descSection.style.display = 'none';

  // Show shows list
  const cats = document.getElementById('detail-cats');
  const shows = c.shows || [];
  cats.innerHTML = shows.length
    ? shows.map(s => `<div class="detail-cat-item">${esc(s)}</div>`).join('')
    : `<div class="detail-cat-item" style="color:var(--text-dim);font-style:italic;">No details listed</div>`;

  document.getElementById('detail-enhancements-section').style.display = 'none';
  document.getElementById('detail-tags').style.display = 'none';
  document.getElementById('detail-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('detail-overlay')) closeDetail();
}

window.openDetail = openDetail;
window.openMiniDetail = openMiniDetail;
window.closeDetail = closeDetail;
window.handleOverlayClick = handleOverlayClick;

load();
</script>
</body>
</html>
