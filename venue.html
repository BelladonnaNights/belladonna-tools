<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belladonna Audio Alchemies — The Full Lineup</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold-light: #E8C97A; --gold-dim: #8B6B2A;
    --ink: #0E0C0A; --surface: #1A1610; --surface2: #201C16;
    --border: rgba(201,168,76,0.2); --border-strong: rgba(201,168,76,0.4);
    --text: #E8DFC8; --text-muted: #9E8E6A; --text-dim: #6A5E42;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink); color: var(--text);
    font-family: 'Crimson Text', serif; font-size: 17px; min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 0%, rgba(201,168,76,0.04) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 100%, rgba(201,168,76,0.03) 0%, transparent 60%);
  }
  .site-header {
    border-bottom: 1px solid var(--border-strong);
    padding: 1.5rem 2rem;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: rgba(14,12,10,0.9); backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-img { width: 44px; height: 44px; object-fit: contain; }
  .wordmark {
    font-family: 'Cinzel', serif;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    display: flex;
    align-items: baseline;
    gap: 0.45em;
    line-height: 1.1;
  }
  .wordmark-one { color: #FFFFFF; }
  .wordmark-two { color: var(--gold); }
  .header-title { font-size: 0.82rem; color: var(--text-muted); letter-spacing: 0.14em; text-transform: uppercase; font-family: 'Cinzel', serif; margin-top: 3px; }
  .header-sub { font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.14em; text-transform: uppercase; }
  .nav-tabs { display: flex; gap: 4px; }
  .nav-tab {
    padding: 0.5rem 1.1rem; border: 1px solid transparent; background: none;
    color: var(--text-muted); font-family: 'Cinzel', serif; font-size: 0.72rem;
    letter-spacing: 0.12em; cursor: pointer; border-radius: 3px; transition: all 0.2s; text-transform: uppercase;
  }
  .nav-tab:hover { color: var(--gold-light); border-color: var(--border); }
  .nav-tab.active { color: var(--gold); border-color: var(--border-strong); background: rgba(201,168,76,0.07); }
  .main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem; }
  .view { display: none; }
  .view.active { display: block; }
  #loading {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 6rem 2rem; gap: 1rem;
  }
  .spinner {
    width: 40px; height: 40px; border: 2px solid var(--border);
    border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-family: 'Cinzel', serif; font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); }
  .empty-state { text-align: center; padding: 6rem 2rem; color: var(--text-dim); }
  .empty-state h2 { font-family: 'Cinzel', serif; font-size: 1rem; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 0.5rem; }
  .nights-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
  .minigames-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.25rem; }
  .night-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; transition: border-color 0.2s, transform 0.2s; cursor: pointer;
  }
  .night-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
  .night-banner { aspect-ratio: 4/5; width: 100%; background: var(--surface2); position: relative; overflow: hidden; }
  .night-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .night-info { padding: 1rem 1.2rem 1.2rem; }
  .night-name { font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 600; color: var(--gold-light); margin-bottom: 0.4rem; line-height: 1.3; }
  .detail-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82);
    z-index: 200; overflow-y: auto; padding: 2rem 1rem;
  }
  .detail-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
  .detail-panel { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; width: 100%; max-width: 560px; overflow: hidden; }
  .detail-banner { aspect-ratio: 4/5; width: 100%; background: var(--surface2); position: relative; overflow: hidden; }
  .detail-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .detail-body { padding: 1.5rem; }
  .detail-name { font-family: 'Cinzel', serif; font-size: 1.4rem; font-weight: 700; color: var(--gold-light); margin-bottom: 1rem; line-height: 1.3; }
  .detail-section-label {
    font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--gold-dim); margin-bottom: 0.5rem;
    display: flex; align-items: center; gap: 8px;
  }
  .detail-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .detail-cat-item { padding: 0.45rem 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; color: var(--text-muted); }
  .detail-cat-item:last-child { border-bottom: none; }
  .detail-enhance-item { display: flex; gap: 10px; padding: 0.5rem 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; color: var(--text); }
  .detail-enhance-item:last-child { border-bottom: none; }
  .detail-enhance-item::before { content: '✦'; color: var(--gold-dim); flex-shrink: 0; margin-top: 1px; }
  .close-btn {
    display: block; width: 100%; padding: 0.8rem; background: none; border: none;
    border-top: 1px solid var(--border); color: var(--text-muted);
    font-family: 'Cinzel', serif; font-size: 0.72rem; letter-spacing: 0.14em;
    text-transform: uppercase; cursor: pointer; transition: color 0.2s, background 0.2s;
  }
  .close-btn:hover { color: var(--gold); background: rgba(201,168,76,0.05); }
  .site-footer {
    text-align: center; padding: 2rem; color: var(--text-dim); font-size: 0.8rem;
    letter-spacing: 0.1em; text-transform: uppercase; font-family: 'Cinzel', serif;
    border-top: 1px solid var(--border); margin-top: 3rem;
  }
  .filter-chip {
    padding: 0.3rem 0.9rem;
    border-radius: 30px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text-muted);
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-chip:hover { border-color: var(--border-strong); color: var(--text); }
  .filter-chip.active { border-color: var(--gold-dim); color: var(--gold); background: rgba(201,168,76,0.1); }

  @media (max-width: 600px) {
    .site-header { flex-direction: column; align-items: flex-start; padding: 1rem; gap: 0.75rem; }
    .main { padding: 1.5rem 1rem; }
    .nights-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
    .minigames-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <img src="logo.png" alt="Belladonna" class="logo-img">
    <div>
      <div class="wordmark">
        <span class="wordmark-one">Belladonna</span><span class="wordmark-two">Venue Menu</span>
      </div>
      <div class="header-title">Belladonna Audio Alchemies</div>
      <div class="header-sub">The Full Lineup</div>
    </div>
  </div>
  <nav class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('nights')">Themed Nights</button>
    <button class="nav-tab" onclick="switchTab('minigames')">Mini Games</button>
    <button class="nav-tab" onclick="switchTab('singalongs')">Sing-Alongs</button>
  </nav>
</header>

<main class="main">
  <div id="loading">
    <div class="spinner"></div>
    <p>Summoning the lineup…</p>
  </div>

  <div class="view active" id="view-nights">
    <div id="nights-empty" class="empty-state" style="display:none;">
      <h2>Nothing Published Yet</h2><p>Check back soon.</p>
    </div>
    <div class="nights-grid" id="nights-grid"></div>
  </div>

  <div class="view" id="view-minigames">
    <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.25rem; flex-wrap:wrap;">
      <div style="flex:1; min-width:0;">
        <div id="mini-filter-chips" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <button class="nav-tab active" style="border-radius:30px; padding:0.3rem 0.9rem; font-size:0.68rem;" onclick="clearMiniFilters()">All</button>
        </div>
      </div>
      <button id="mini-filter-visibility-btn" onclick="toggleMiniFilterVisibility()"
        style="background:none; border:1px solid var(--border); color:var(--text-muted); font-family:'Cinzel',serif; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.35rem 0.75rem; border-radius:3px; cursor:pointer; white-space:nowrap; transition:all 0.2s;"
        onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--text-muted)'">☰ Filters</button>
    </div>
    <div id="minigames-empty" class="empty-state" style="display:none;">
      <h2>No Mini Games Yet</h2><p>Check back soon.</p>
    </div>
    <div class="minigames-grid" id="minigames-grid"></div>
  </div>
  <div class="view" id="view-singalongs">
    <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.25rem; flex-wrap:wrap;">
      <div style="flex:1; min-width:0;">
        <div id="singa-filter-chips" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <button class="filter-chip active" onclick="clearSingaFilters()">All</button>
        </div>
      </div>
      <button id="singa-filter-visibility-btn" onclick="toggleSingaFilterVisibility()"
        style="background:none;border:1px solid var(--border);color:var(--text-muted);font-family:'Cinzel',serif;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.35rem 0.75rem;border-radius:3px;cursor:pointer;white-space:nowrap;transition:all 0.2s;"
        onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--text-muted)'">☰ Filters</button>
    </div>
    <div id="singalongs-empty" class="empty-state" style="display:none;">
      <h2>No Sing-Alongs Yet</h2><p>Check back soon.</p>
    </div>
    <div class="minigames-grid" id="singalongs-grid"></div>
  </div>
</main>

<div class="detail-overlay" id="detail-overlay" onclick="handleOverlayClick(event)">
  <div class="detail-panel">
    <div class="detail-banner" id="detail-banner"></div>
    <div class="detail-body">
      <div class="detail-name" id="detail-name"></div>
      <div id="detail-tags" style="display:none; gap:5px; flex-wrap:wrap; margin-bottom:0.75rem;"></div>
      <div id="detail-description-section" style="display:none; margin-bottom:1.25rem;">
        <p id="detail-description" style="font-size:1rem; color:var(--text-muted); line-height:1.7; font-style:italic;"></p>
      </div>
      <div id="detail-cats-section">
        <div class="detail-section-label" id="detail-cats-label">Categories</div>
        <div class="detail-cat-item" id="detail-cats"></div>
      </div>
      <div id="detail-enhancements-section" style="display:none;">
        <div class="detail-section-label">Night Enhancements</div>
        <div id="detail-enhancements"></div>
      </div>
    </div>
    <button class="close-btn" onclick="closeDetail()">Close</button>
  </div>
</div>

<footer class="site-footer">Belladonna Audio Alchemies &nbsp;✦&nbsp; Seattle–Tacoma</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQUq6wKgBHIfaVCjxOXa7fpsJ0qmTocqI",
  authDomain: "belladonnabrainstormtool.firebaseapp.com",
  projectId: "belladonnabrainstormtool",
  storageBucket: "belladonnabrainstormtool.firebasestorage.app",
  messagingSenderId: "981934324501",
  appId: "1:981934324501:web:9ba85ffde67d2d2b95c71c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let publishedNights = [];
let publishedMiniGames = [];
let venueMiniTags = [];
let activeMiniFilters = new Set();
let miniFiltersVisible = true;
let venueSingaTags = [];
let activeSingaFilters = new Set();
let singaFiltersVisible = true;
let publishedSingAlongs = [];

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function switchTab(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => {
    const lmap = {nights:'night', minigames:'mini', singalongs:'sing'};
    if (t.textContent.toLowerCase().includes(lmap[name]||name)) t.classList.add('active');
  });
}

async function load() {
  try {
    const [nightsSnap, catsSnap] = await Promise.all([
      getDocs(collection(db, 'nights')),
      getDocs(collection(db, 'categories'))
    ]);
    publishedNights = nightsSnap.docs.map(d => ({ _id: d.id, ...d.data() }))
      .filter(n => n.published).sort((a,b) => (a.position??9999) - (b.position??9999));
    publishedMiniGames = catsSnap.docs.map(d => ({ _id: d.id, ...d.data() }))
      .filter(c => c.published && (c.type||'').toLowerCase().includes('mini'))
      .sort((a,b) => (a.position??9999) - (b.position??9999));

    publishedSingAlongs = catsSnap.docs.map(d => ({ _id: d.id, ...d.data() }))
      .filter(c => c.published && (c.type||'').toLowerCase().includes('sing'))
      .sort((a,b) => (a.position??9999) - (b.position??9999));

    try {
      const mSnap = await getDoc(doc(db, 'config', 'miniTags'));
      venueMiniTags = mSnap.exists() ? (mSnap.data().tags || []) : [];
    } catch(e) { venueMiniTags = []; }
    try {
      const sSnap = await getDoc(doc(db, 'config', 'singaTags'));
      venueSingaTags = sSnap.exists() ? (sSnap.data().tags || []) : [];
    } catch(e) { venueSingaTags = []; }
  } catch(e) { console.error('Load error:', e); }

  document.getElementById('loading').style.display = 'none';
  renderNights();
  renderMiniGames();
  renderSingAlongs();
}

function renderNights() {
  const grid = document.getElementById('nights-grid');
  const empty = document.getElementById('nights-empty');
  if (!publishedNights.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  grid.innerHTML = publishedNights.map((n, i) => {
    const bgColor = n.bannerColor ? `background:${n.bannerColor};` : '';
    const bannerImg = n.bannerData ? `<img src="${n.bannerData}" alt="${esc(n.name)}">` : '';
    return `<div class="night-card" onclick="openNightDetail(${i})">
      <div class="night-banner" style="${bgColor}">${bannerImg}</div>
      <div class="night-info">
        <div class="night-name">${esc(n.name)}</div>
        ${n.description ? `<p style="font-size:0.88rem;color:var(--text-muted);line-height:1.55;font-style:italic;">${esc(n.description)}</p>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderMiniFilterChips() {
  const bar = document.getElementById('mini-filter-chips');
  if (!bar) return;
  bar.style.display = miniFiltersVisible ? 'flex' : 'none';
  const allActive = activeMiniFilters.size === 0;
  bar.innerHTML = `<button class="filter-chip${allActive ? ' active' : ''}" onclick="clearMiniFilters()">All</button>`
    + venueMiniTags.map(t =>
      `<button class="filter-chip${activeMiniFilters.has(t) ? ' active' : ''}" onclick="toggleMiniFilter('${t.replace(/'/g,"\\'")}'">${t}</button>`
    ).join('');
  const btn = document.getElementById('mini-filter-visibility-btn');
  if (btn) btn.style.color = miniFiltersVisible ? 'var(--gold)' : 'var(--text-muted)';
}

function clearMiniFilters() {
  activeMiniFilters.clear();
  renderMiniFilterChips();
  renderMiniGames();
}

function toggleMiniFilter(tag) {
  if (activeMiniFilters.has(tag)) activeMiniFilters.delete(tag);
  else activeMiniFilters.add(tag);
  renderMiniFilterChips();
  renderMiniGames();
}

function toggleMiniFilterVisibility() {
  miniFiltersVisible = !miniFiltersVisible;
  renderMiniFilterChips();
}

function renderMiniGames() {
  renderMiniFilterChips();
  const grid = document.getElementById('minigames-grid');
  const empty = document.getElementById('minigames-empty');
  const filtered = activeMiniFilters.size > 0
    ? publishedMiniGames.filter(c => {
        const catTags = (c.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
        return [...activeMiniFilters].every(f => catTags.includes(f));
      })
    : publishedMiniGames;
  if (!filtered.length) { empty.style.display = 'block'; grid.innerHTML = ''; return; }
  empty.style.display = 'none';
  grid.innerHTML = filtered.map((c, i) => {
    const realIdx = publishedMiniGames.indexOf(c);
    const src = c.miniGameImage || c.bannerData || null;
    const bannerImg = src ? `<img src="${src}" alt="${esc(c.name)}">` : '';
    const tagHtml = (c.tags||'').split(',').map(t=>t.trim()).filter(Boolean)
      .map(t=>`<span style="background:rgba(60,80,100,0.25);color:#9BB8D4;border:1px solid rgba(100,140,180,0.2);font-size:0.65rem;padding:2px 8px;border-radius:3px;font-family:'Cinzel',serif;letter-spacing:0.06em;">${esc(t)}</span>`).join('');
    return `<div class="night-card" onclick="openMiniDetail(${realIdx})">
      <div class="night-banner" style="background:var(--surface2);">${bannerImg}</div>
      <div class="night-info">
        <div class="night-name">${esc(c.name)}</div>
        ${c.theme ? `<p style="font-size:0.82rem;color:var(--text-muted);font-weight:600;margin-bottom:0.4rem;">${esc(c.theme)}</p>` : ''}
        ${tagHtml ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:0.3rem;">${tagHtml}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function openNightDetail(i) {
  const n = publishedNights[i];
  const bannerEl = document.getElementById('detail-banner');
  bannerEl.style.cssText = n.bannerColor ? `background:${n.bannerColor};` : '';
  bannerEl.innerHTML = n.bannerData ? `<img src="${n.bannerData}" alt="${esc(n.name)}">` : '';
  document.getElementById('detail-name').textContent = n.name;
  document.getElementById('detail-cats-label').textContent = 'Categories';

  const tagsEl = document.getElementById('detail-tags');
  const tags = n.nightTagsList || [];
  tagsEl.innerHTML = tags.map(t=>`<span style="background:rgba(60,80,100,0.25);color:#9BB8D4;border:1px solid rgba(100,140,180,0.2);font-size:0.7rem;padding:2px 9px;border-radius:3px;font-family:'Cinzel',serif;letter-spacing:0.06em;">${esc(t)}</span>`).join('');
  tagsEl.style.display = tags.length ? 'flex' : 'none';

  const descSection = document.getElementById('detail-description-section');
  if (n.description) { document.getElementById('detail-description').textContent = n.description; descSection.style.display = 'block'; }
  else descSection.style.display = 'none';

  const cats = n.categoryIds || [];
  document.getElementById('detail-cats-section').style.display = 'block';
  document.getElementById('detail-cats').innerHTML = cats.length
    ? cats.map(id => `<div class="detail-cat-item">${esc(id)}</div>`).join('')
    : `<div class="detail-cat-item" style="color:var(--text-dim);font-style:italic;">No categories listed</div>`;

  const enhancements = n.enhancements || [];
  const enhSection = document.getElementById('detail-enhancements-section');
  if (enhancements.length) {
    document.getElementById('detail-enhancements').innerHTML = enhancements.map(e=>`<div class="detail-enhance-item">${esc(e)}</div>`).join('');
    enhSection.style.display = 'block';
  } else enhSection.style.display = 'none';

  document.getElementById('detail-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openMiniDetail(i) {
  const c = publishedMiniGames[i];
  const src = c.miniGameImage || c.bannerData || null;
  const bannerEl = document.getElementById('detail-banner');
  bannerEl.style.cssText = 'background:var(--surface2);';
  bannerEl.innerHTML = src ? `<img src="${src}" alt="${esc(c.name)}">` : '';
  document.getElementById('detail-name').textContent = c.name;
  document.getElementById('detail-cats-label').textContent = 'Details';
  document.getElementById('detail-tags').style.display = 'none';
  document.getElementById('detail-description-section').style.display = 'none';
  document.getElementById('detail-enhancements-section').style.display = 'none';
  document.getElementById('detail-cats-section').style.display = 'block';
  const shows = c.shows || [];
  document.getElementById('detail-cats').innerHTML = shows.length
    ? shows.map(s=>`<div class="detail-cat-item">${esc(s)}</div>`).join('')
    : `<div class="detail-cat-item" style="color:var(--text-dim);font-style:italic;">No details listed</div>`;
  document.getElementById('detail-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('detail-overlay')) closeDetail();
}

function renderSingaFilterChips() {
  const bar = document.getElementById('singa-filter-chips');
  if (!bar) return;
  bar.style.display = singaFiltersVisible ? 'flex' : 'none';
  const allActive = activeSingaFilters.size === 0;
  bar.innerHTML = `<button class="filter-chip${allActive ? ' active' : ''}" onclick="clearSingaFilters()">All</button>`
    + venueSingaTags.map(t =>
      `<button class="filter-chip${activeSingaFilters.has(t) ? ' active' : ''}" onclick="toggleSingaFilter('${t.replace(/'/g,"\\'")}'">${t}</button>`
    ).join('');
  const btn = document.getElementById('singa-filter-visibility-btn');
  if (btn) btn.style.color = singaFiltersVisible ? 'var(--gold)' : 'var(--text-muted)';
}

function clearSingaFilters() { activeSingaFilters.clear(); renderSingaFilterChips(); renderSingAlongs(); }
function toggleSingaFilter(tag) {
  if (activeSingaFilters.has(tag)) activeSingaFilters.delete(tag); else activeSingaFilters.add(tag);
  renderSingaFilterChips(); renderSingAlongs();
}
function toggleSingaFilterVisibility() { singaFiltersVisible = !singaFiltersVisible; renderSingaFilterChips(); }

function renderSingAlongs() {
  renderSingaFilterChips();
  const grid = document.getElementById('singalongs-grid');
  const empty = document.getElementById('singalongs-empty');
  const filtered = activeSingaFilters.size > 0
    ? publishedSingAlongs.filter(c => {
        const catTags = (c.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
        return [...activeSingaFilters].every(f => catTags.includes(f));
      })
    : publishedSingAlongs;
  if (!filtered.length) { empty.style.display = 'block'; grid.innerHTML = ''; return; }
  empty.style.display = 'none';
  grid.innerHTML = filtered.map((c, i) => {
    const realIdx = publishedSingAlongs.indexOf(c);
    const src = c.miniGameImage || c.bannerData || null;
    const bannerImg = src ? `<img src="${src}" alt="${esc(c.name)}">` : '';
    const tagHtml = (c.tags||'').split(',').map(t=>t.trim()).filter(Boolean)
      .map(t=>`<span style="background:rgba(60,80,100,0.25);color:#9BB8D4;border:1px solid rgba(100,140,180,0.2);font-size:0.65rem;padding:2px 8px;border-radius:3px;font-family:'Cinzel',serif;letter-spacing:0.06em;">${esc(t)}</span>`).join('');
    return `<div class="night-card" onclick="openSingaDetail(${realIdx})">
      <div class="night-banner" style="background:var(--surface2);">${bannerImg}</div>
      <div class="night-info">
        <div class="night-name">${esc(c.name)}</div>
        ${c.theme ? `<p style="font-size:0.82rem;color:var(--text-muted);font-weight:600;margin-bottom:0.4rem;">${esc(c.theme)}</p>` : ''}
        ${tagHtml ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:0.3rem;">${tagHtml}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function openSingaDetail(i) {
  const c = publishedSingAlongs[i];
  const src = c.miniGameImage || c.bannerData || null;
  const bannerEl = document.getElementById('detail-banner');
  bannerEl.style.cssText = 'background:var(--surface2);';
  bannerEl.innerHTML = src ? `<img src="${src}" alt="${esc(c.name)}">` : '';
  document.getElementById('detail-name').textContent = c.name;
  document.getElementById('detail-cats-label').textContent = 'Details';
  document.getElementById('detail-tags').style.display = 'none';
  document.getElementById('detail-description-section').style.display = 'none';
  document.getElementById('detail-enhancements-section').style.display = 'none';
  document.getElementById('detail-cats-section').style.display = 'block';
  const shows = c.shows || [];
  document.getElementById('detail-cats').innerHTML = shows.length
    ? shows.map(s=>`<div class="detail-cat-item">${esc(s)}</div>`).join('')
    : `<div class="detail-cat-item" style="color:var(--text-dim);font-style:italic;">No details listed</div>`;
  document.getElementById('detail-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

window.switchTab = switchTab;
window.openNightDetail = openNightDetail;
window.openMiniDetail = openMiniDetail;
window.closeDetail = closeDetail;
window.handleOverlayClick = handleOverlayClick;
window.clearMiniFilters = clearMiniFilters;
window.toggleMiniFilter = toggleMiniFilter;
window.toggleMiniFilterVisibility = toggleMiniFilterVisibility;
window.clearSingaFilters = clearSingaFilters;
window.toggleSingaFilter = toggleSingaFilter;
window.toggleSingaFilterVisibility = toggleSingaFilterVisibility;
window.openSingaDetail = openSingaDetail;

load();
</script>
</body>
</html>
