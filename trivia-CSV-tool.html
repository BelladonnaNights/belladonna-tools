<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Belladonna Nights — Bulk Trivia to CSV</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@500;700&family=EB+Garamond:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap');

  :root{
    --black:#0a0a0a;
    --black-2:#141414;
    --gold:#c9a84c;
    --gold-dim:#8a7434;
    --cream:#efe9db;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--black);
    color:var(--cream);
    font-family:'DM Sans', sans-serif;
    padding:40px 24px 80px;
  }

  h1{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:2px;
    font-size:42px;
    color:var(--gold);
    text-align:center;
    margin:0 0 4px;
  }

  .subtitle{
    text-align:center;
    font-family:'Cinzel', serif;
    color:var(--gold-dim);
    font-size:14px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:36px;
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
  }

  .panel{
    background:var(--black-2);
    border:1px solid var(--gold-dim);
    border-radius:10px;
    padding:24px;
    margin-bottom:24px;
  }

  label{
    display:block;
    font-family:'Cinzel', serif;
    color:var(--gold);
    letter-spacing:1px;
    font-size:13px;
    text-transform:uppercase;
    margin-bottom:10px;
  }

  textarea{
    width:100%;
    min-height:220px;
    background:#0d0d0d;
    color:var(--cream);
    border:1px solid var(--gold-dim);
    border-radius:6px;
    padding:14px;
    font-family:'EB Garamond', serif;
    font-size:16px;
    line-height:1.5;
    resize:vertical;
  }

  textarea:focus{
    outline:none;
    border-color:var(--gold);
  }

  .hint{
    font-family:'EB Garamond', serif;
    font-style:italic;
    color:#9a927c;
    font-size:14px;
    margin-top:10px;
  }

  .row{
    display:flex;
    gap:14px;
    align-items:center;
    flex-wrap:wrap;
    margin-top:18px;
  }

  button{
    font-family:'Cinzel', serif;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:13px;
    background:var(--gold);
    color:var(--black);
    border:none;
    padding:12px 22px;
    border-radius:6px;
    cursor:pointer;
    font-weight:700;
    transition:transform .12s ease, box-shadow .12s ease;
  }

  button:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(201,168,76,0.25);
  }

  button.secondary{
    background:transparent;
    color:var(--gold);
    border:1px solid var(--gold-dim);
  }

  #status{
    font-family:'EB Garamond', serif;
    font-size:14px;
    color:var(--gold-dim);
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    margin-top:10px;
  }

  th{
    background:#1c1c14;
    color:var(--gold);
    font-family:'Cinzel', serif;
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:1px;
    padding:10px 8px;
    text-align:left;
    border-bottom:2px solid var(--gold-dim);
    position:sticky;
    top:0;
  }

  td{
    padding:10px 8px;
    border-bottom:1px solid #262620;
    vertical-align:top;
    font-family:'EB Garamond', serif;
  }

  tr:nth-child(even) td{
    background:#111109;
  }

  .table-scroll{
    max-height:480px;
    overflow:auto;
    border:1px solid var(--gold-dim);
    border-radius:6px;
  }

  .count-badge{
    display:inline-block;
    background:var(--gold);
    color:var(--black);
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:12px;
    padding:4px 10px;
    border-radius:20px;
    margin-left:8px;
  }

  .error-line{
    color:#d97b6c;
    font-family:'EB Garamond', serif;
    font-size:14px;
    margin-top:4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bulk Trivia &rarr; CSV</h1>
  <div class="subtitle">Belladonna Nights</div>

  <div class="panel">
    <label>Paste your questions</label>
    <textarea id="input" placeholder="* What outlaw was famously shot and killed by Pat Garrett? Answer: Billy the Kid
* What is the name of Indiana Jones's signature weapon? Answer: A whip"></textarea>
    <div class="hint">One question per line, starting with * (or -), formatted as: Question? Answer: The Answer</div>
    <div class="row">
      <button onclick="parseInput()">Parse Questions</button>
      <button class="secondary" onclick="downloadCSV()" id="downloadBtn" disabled>Download CSV</button>
      <span id="status"></span>
    </div>
  </div>

  <div class="panel" id="previewPanel" style="display:none;">
    <label>Preview <span class="count-badge" id="countBadge">0</span></label>
    <div class="table-scroll">
      <table id="previewTable">
        <thead>
          <tr>
            <th>Question</th>
            <th>Answer</th>
            <th>Difficulty (1-3)</th>
            <th>IMG URL</th>
            <th>SOUND URL</th>
            <th>Option A</th>
            <th>Option B</th>
            <th>Option C</th>
            <th>Option D</th>
            <th>Bonus Question</th>
            <th>Bonus Answer</th>
          </tr>
        </thead>
        <tbody id="previewBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let parsedRows = [];

function parseInput(){
  const raw = document.getElementById('input').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);

  parsedRows = [];
  const errors = [];

  lines.forEach((line, idx) => {
    // strip leading bullet markers: *, -, •, or numbered "1."
    let cleaned = line.replace(/^[\*\-•]\s*/, '').replace(/^\d+[\.\)]\s*/, '').trim();

    // find "Answer:" case-insensitively, split on first occurrence
    const match = cleaned.match(/^(.*?)\s*Answer:\s*(.*)$/i);

    if (!match) {
      errors.push(`Line ${idx + 1}: could not find "Answer:" — "${line.slice(0,60)}${line.length>60?'…':''}"`);
      return;
    }

    const question = match[1].trim();
    const answer = match[2].trim();

    if (!question || !answer) {
      errors.push(`Line ${idx + 1}: missing question or answer — "${line.slice(0,60)}${line.length>60?'…':''}"`);
      return;
    }

    parsedRows.push({
      question, answer,
      difficulty: '', img: '', sound: '',
      optA: '', optB: '', optC: '', optD: '',
      bonusQ: '', bonusA: ''
    });
  });

  renderPreview();

  const statusEl = document.getElementById('status');
  let statusText = `Parsed ${parsedRows.length} question${parsedRows.length===1?'':'s'}.`;
  statusEl.innerHTML = statusText + (errors.length ? `<div class="error-line">${errors.join('<br>')}</div>` : '');

  document.getElementById('downloadBtn').disabled = parsedRows.length === 0;
}

function renderPreview(){
  const panel = document.getElementById('previewPanel');
  const body = document.getElementById('previewBody');
  const badge = document.getElementById('countBadge');
  body.innerHTML = '';

  if (parsedRows.length === 0){
    panel.style.display = 'none';
    return;
  }

  panel.style.display = 'block';
  badge.textContent = parsedRows.length;

  parsedRows.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(row.question)}</td>
      <td>${escapeHtml(row.answer)}</td>
      <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    `;
    body.appendChild(tr);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function csvEscape(val){
  if (val == null) val = '';
  val = String(val);
  if (/[",\n]/.test(val)){
    val = '"' + val.replace(/"/g, '""') + '"';
  }
  return val;
}

function downloadCSV(){
  if (parsedRows.length === 0) return;

  const header = ['Question','Answer','Difficulty (1-3)','IMG URL','SOUND URL','Option A','Option B','Option C','Option D','Bonus Question','Bonus Answer'];
  const lines = [header.map(csvEscape).join(',')];

  parsedRows.forEach(row => {
    lines.push([
      row.question, row.answer, row.difficulty, row.img, row.sound,
      row.optA, row.optB, row.optC, row.optD, row.bonusQ, row.bonusA
    ].map(csvEscape).join(','));
  });

  const csvContent = lines.join('\n');
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'trivia_questions.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
