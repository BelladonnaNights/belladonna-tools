<style>
:root{--gold:#c9a84c;--gold2:#e8c96a;--gold3:#f5df90;--bg:#080808;--surface:#121110;--text:#f0ede8;--text2:#b0a898;--text3:#6d655a;--border2:rgba(255,255,255,.18);--display:'Bebas Neue','Impact',sans-serif;--cinzel:'Cinzel','Georgia',serif;--font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
body{display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 0,#1c1608 0,#080808 60%)}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;text-align:center}
.brand{font-family:var(--cinzel);letter-spacing:.3em;font-size:11px;color:var(--gold);text-transform:uppercase}
.me{display:flex;justify-content:space-between;align-items:center;padding:6px 18px;font-size:15px;color:var(--text2)}
.me b{color:var(--text);font-weight:700}.score{font-family:var(--display);font-size:30px;color:var(--gold2);letter-spacing:.04em}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 20px calc(20px + env(safe-area-inset-bottom));min-height:0}
#join{width:100%;max-width:360px;text-align:center}
#join img{width:62%;margin-bottom:6px}
#join h1{font-family:var(--display);font-size:50px;letter-spacing:.05em;color:var(--gold2);line-height:1}
#join p{color:var(--text2);margin:8px 0 18px}
#join input{width:100%;font-size:22px;padding:14px;border-radius:12px;border:1px solid var(--border2);background:var(--surface);color:var(--text);text-align:center;outline:none;font-family:inherit;margin-bottom:10px}
#join input:focus{border-color:var(--gold)}#code{letter-spacing:.4em;text-transform:uppercase;font-weight:700}
.go{margin-top:6px;width:100%;font-family:var(--display);font-size:30px;letter-spacing:.08em;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#c9a84c,#f5df90 50%,#c9a84c);color:#120e02}
.go:disabled{opacity:.5}
#err{color:#ff8a7a;font-size:14px;min-height:20px;margin-top:10px}
#game{display:none;width:100%;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0}
#wrap{position:relative;display:flex;align-items:center;justify-content:center}
#buzz{width:min(78vw,52vh);height:min(78vw,52vh);border-radius:50%;border:none;font-family:var(--display);font-size:clamp(48px,16vw,92px);letter-spacing:.06em;
 background:radial-gradient(circle at 40% 32%,#fff6cf 0,#f5c542 30%,#c28a14 70%,#7a5207 100%);color:#2a1d00;box-shadow:0 0 0 8px rgba(245,197,66,.16),0 0 60px rgba(245,197,66,.55),inset 0 -10px 24px rgba(0,0,0,.3);transition:transform .05s,filter .2s,box-shadow .2s;touch-action:manipulation}
#buzz:active{transform:scale(.95)}
#buzz.off{background:radial-gradient(circle at 35% 30%,#3c3a37 0,#26241f 60%,#171614 100%);color:#6d655a;box-shadow:inset 0 -10px 24px rgba(0,0,0,.4);pointer-events:none}
#buzz.armed{animation:pulse 1.1s ease-in-out infinite}
#buzz.you{background:radial-gradient(circle at 40% 32%,#fff 0,#fff3b0 30%,#f5c542 70%,#b8860b 100%);color:#2a1d00;box-shadow:0 0 0 14px rgba(255,236,160,.3),0 0 140px rgba(255,226,130,1);pointer-events:none}
#buzz.out{background:radial-gradient(circle at 35% 30%,#4a2323 0,#2b1414 70%);color:#a05555;pointer-events:none;box-shadow:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 8px rgba(245,197,66,.16),0 0 50px rgba(245,197,66,.45),inset 0 -10px 24px rgba(0,0,0,.3)}50%{box-shadow:0 0 0 20px rgba(245,197,66,.06),0 0 95px rgba(255,214,102,.85),inset 0 -10px 24px rgba(0,0,0,.3)}}
#moth{position:absolute;top:-6%;left:50%;width:52%;margin-left:-26%;z-index:2;pointer-events:none;opacity:.95;filter:drop-shadow(0 0 10px rgba(0,0,0,.6));transition:top .35s,transform .35s;animation:flutter 1.6s ease-in-out infinite}
#moth.landed{top:-12%;animation:none;transform:scale(.78)}
@keyframes flutter{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
#alt img{animation:none!important}
#msg{font-family:var(--cinzel);letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--text2);text-align:center;min-height:36px;line-height:1.4}
#msg b{color:var(--gold2)}
#alt{display:none;width:100%;max-width:420px;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:28px 4px 12px;overflow:visible}
#alt>*{flex:none}
#alt .t{font-family:var(--display);font-size:46px;letter-spacing:.05em;color:var(--gold2);line-height:1}#alt .s{color:var(--text2);font-size:15px;line-height:1.4}#alt img{width:34vw;max-width:150px;filter:drop-shadow(0 0 14px rgba(232,201,106,.5));animation:flutter 1.6s ease-in-out infinite}
#alt .q{font-family:var(--display);font-size:34px;color:var(--text);letter-spacing:.03em;line-height:1.05}
.abig{width:min(70vw,44vh);height:min(70vw,44vh);border-radius:50%;border:none;font-family:var(--display);font-size:clamp(40px,13vw,70px);letter-spacing:.06em;background:radial-gradient(circle at 40% 32%,#fff6cf 0,#f5c542 30%,#c28a14 70%,#7a5207 100%);color:#2a1d00;animation:pulse 1.1s ease-in-out infinite;touch-action:manipulation}
.abig:active{transform:scale(.95)}
.opt{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;font-size:20px;font-weight:700;border-radius:14px;border:2px solid var(--border2);background:var(--surface2);color:var(--text);text-align:left;touch-action:manipulation}
.opt.mine{border-color:var(--gold2);background:rgba(201,168,76,.18);color:var(--gold3)}.opt.lead{border-color:var(--green)}.opt:disabled{opacity:.9}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
#conn{position:fixed;left:0;right:0;top:0;background:#7a1e1e;color:#fff;text-align:center;padding:6px;font-size:13px;display:none;z-index:9}
</style></head><body>

async function join(){
  const c = $('#code').value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4), n = $('#nm').value.trim().replace(/\s+/g,' ');
  $('#err').textContent = '';
  if (c.length !== 4) { $('#err').textContent = 'Enter the 4-letter room code from the TV.'; return $('#code').focus(); }
  if (!n) { $('#err').textContent = 'Type a name first.'; return $('#nm').focus(); }
  $('#goBtn').disabled = true;
  try {
    const meta = await get(ref(db, 'moth/sessions/' + c + '/meta'));
    if (!meta.exists()) { $('#err').textContent = "That code isn't active. Check the code on the TV."; $('#goBtn').disabled = false; return; }
    code = c; LS.set('moth-name', n);
    let saved = null; try { saved = JSON.parse(LS.get('moth-' + code) || 'null'); } catch(e){}
    pid = saved && saved.pid ? saved.pid : uid();
    LS.set('moth-' + code, JSON.stringify({ pid }));

}
function enter(){
  joinedAt = Date.now();

    if (ok) { const pr = ref(db, base() + '/presence/' + pid); onDisconnect(pr).remove().then(() => set(pr, true)).catch(()=>{}); }
  }));
  unsubs.push(onValue(ref(db, base() + '/state'), s => { prevSet(s.val()); render(); }));
  unsubs.push(onValue(ref(db, base() + '/meta'), s => { if (!s.exists() && Date.now() - joinedAt > 2000) leave('The host ended this game.'); }));
}
function leave(msg){
  unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs = []; st = null; prev = null;

}
function prevSet(n){ prev = st; st = n; }

  { const md = st.mode || 'hub'; if (md !== 'tune') { altShow(true); const en = !!(st.raffle && (st.raffle.entries || []).includes(pid)); const v = st.vote || {}; altRender(md, en, myVoteFor(v.id)); return; } altShow(false); }

  else if (r.state === 'playing') { b.classList.add('out'); text = 'OUT'; m = "You're locked out this song"; }

  else if (r.state === 'buzzed' && cur) { b.classList.add('off'); text = '…'; m = '<b style="color:' + esc(cur.color) + '">' + esc(cur.name) + '</b> buzzed first'; }

  else { b.classList.add('off'); m = r.state === 'cued' ? 'Get ready…' : 'Waiting for the host'; }

  if (pm && me.score < pm.score) flash('#e74c3c', 400);
}

  b.className = 'you'; b.textContent = '…'; $('#moth').classList.add('landed');     // optimistic; the host decides who really won
}

    } else h=M+'<div class="t">Vote coming up</div><div class="s">Get ready to pick.</div>';
