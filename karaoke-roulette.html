<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Roulette</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ───────────────────────────────────── */
:root{
  --bg:#080806; --surface:#111108; --surface2:#1a1a10; --surface3:#222218;
  --border:rgba(201,168,76,.12); --border2:rgba(201,168,76,.25); --border3:rgba(201,168,76,.45);
  --text:#f0ede8; --text2:#b0a898; --text3:#6a6050;
  --gold:#c9a84c; --gold2:#e8c96a; --gold3:#f5df90;
  --gold-shine:linear-gradient(135deg,#c9a84c 0%,#f5df90 45%,#c9a84c 70%,#e2b84a 100%);
  --gold-dim:rgba(201,168,76,.10); --gold-glow:rgba(201,168,76,.35);
  --danger:#c05050; --danger-bg:rgba(192,80,80,.12); --danger-border:rgba(192,80,80,.3);
  /* drum sizing — overridden in fullscreen */
  --slot-h:clamp(64px,7.5vh,88px); --drum-w:clamp(260px,36vw,460px); --vis:7;
}

/* TV / fullscreen overrides */
:root.fs{
  --slot-h:clamp(90px,10vh,112px);
  --drum-w:clamp(460px,34vw,600px);
  --vis:7;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
  user-select:none;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.5;
}

/* ─── TOP BAR ──────────────────────────────────── */
.top-bar{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px 0;
  position:relative;z-index:10;
  flex-shrink:0;
}
.top-bar-left{display:flex;align-items:center;gap:14px;}
.top-bar-right{display:flex;align-items:center;gap:10px;}

/* Logo image slot */
.logo-img{
  height:clamp(56px,6vh,80px);width:auto;object-fit:contain;
  display:block;cursor:pointer;
}
.logo-img-placeholder{
  width:clamp(56px,6vh,80px);height:clamp(56px,6vh,80px);border-radius:10px;
  border:1px dashed rgba(201,168,76,.3);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:border-color .2s;
  background:rgba(201,168,76,.04);
}
.logo-img-placeholder:hover{ border-color:rgba(201,168,76,.6); }
.logo-img-placeholder svg{ opacity:.35; }
/* Brand block */
.brand-block{
  display:flex;flex-direction:column;gap:3px;
}
.brand-publisher{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(1.1rem,1.8vw,1.5rem);
  font-weight:400;letter-spacing:.04em;text-transform:uppercase;
  line-height:1;white-space:nowrap;
}
.brand-publisher .bp-name{ color:#f0ede8; }
.brand-publisher .bp-accent{ color:var(--gold2); }
.logo-text{
  font-family:'Cinzel',serif;
  font-size:clamp(1.9rem,3.8vw,3.2rem);
  font-weight:700;letter-spacing:.12em;
  background:var(--gold-shine);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1;white-space:nowrap;
  text-transform:uppercase;
}
.logo-divider{
  width:1px;height:clamp(50px,6vh,72px);
  background:linear-gradient(to bottom,transparent,rgba(201,168,76,.4),transparent);
  margin:0 4px;
}
.logo-sub-text{
  font-family:'Cinzel',serif;font-size:clamp(.65rem,.9vw,.85rem);
  letter-spacing:.28em;text-transform:uppercase;
  color:var(--text3);line-height:1.6;
}

/* top bar buttons */
.tbbtn{
  background:transparent;border:1px solid var(--border2);border-radius:8px;
  color:var(--text3);font-family:'Cinzel',serif;font-size:clamp(.65rem,.85vw,.82rem);
  letter-spacing:.16em;text-transform:uppercase;
  padding:9px 18px;cursor:pointer;transition:all .18s;white-space:nowrap;
}
.tbbtn:hover{border-color:var(--border3);color:var(--gold2);}
.fs-btn{font-size:clamp(.75rem,.95vw,.95rem);padding:10px 20px;}

/* ─── MAIN STAGE ───────────────────────────────── */
/* fills remaining viewport height so wheels centre vertically */
.stage{
  flex:1;
  width:100%;max-width:1400px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding:clamp(16px,3vh,32px) 28px clamp(24px,4vh,40px);
  gap:clamp(12px,1.8vh,22px);
  position:relative;z-index:1;
  overflow-y:auto;
}

/* ornament line */
.stage-orn{display:flex;align-items:center;gap:10px;width:clamp(160px,50vw,500px);}
.orn-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.4),transparent);}
.orn-diamond{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex-shrink:0;box-shadow:0 0 7px rgba(201,168,76,.6);}

/* ─── ADMIN PANEL ──────────────────────────────── */
.admin-panel{
  width:100%;max-width:820px;
  background:var(--surface);border:1px solid var(--border2);border-radius:16px;
  overflow:hidden;max-height:0;opacity:0;
  transition:max-height .45s cubic-bezier(.4,0,.2,1),opacity .3s ease;
}
.admin-panel.open{max-height:1200px;opacity:1;}
.admin-inner{padding:24px 26px;}
.admin-title{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:10px;}
.admin-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent);}
.admin-cols{display:grid;grid-template-columns:1fr 1.6fr;gap:24px;}
@media(max-width:620px){.admin-cols{grid-template-columns:1fr;}}
.a-col-head{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
.inp-row{display:flex;gap:8px;margin-bottom:10px;}
.inp-row input{flex:1;background:#0a0a06;border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:8px 12px;outline:none;transition:border-color .2s;}
.inp-row input:focus{border-color:var(--gold);}
.inp-row input::placeholder{color:var(--text3);}
.gbtn{background:var(--gold-dim);border:1px solid var(--border3);border-radius:8px;color:var(--gold2);font-family:'Cinzel',serif;font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;cursor:pointer;white-space:nowrap;transition:all .18s;}
.gbtn:hover{background:var(--gold);color:#000;border-color:var(--gold);}
.gbtn:active{transform:scale(.97);}
.gbtn.sm{padding:4px 9px;font-size:.54rem;}
.gbtn.danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger);}
.gbtn.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger);}
.cat-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
.cat-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;transition:border-color .15s;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.05em;color:var(--text2);}
.cat-row:hover{border-color:var(--border2);}
.cat-row.selected{border-color:var(--border3);background:var(--surface3);color:var(--gold2);}
.cat-row-name{flex:1;}
.cat-count{font-size:.56rem;color:var(--text3);font-family:'DM Sans',sans-serif;}
.song-editor{display:flex;flex-direction:column;gap:8px;}
.song-editor-head{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);min-height:16px;}
.song-editor-head span{color:var(--gold2);}
.song-list{display:flex;flex-direction:column;gap:3px;max-height:180px;overflow-y:auto;margin-bottom:2px;}
.song-row{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);}
.song-row-name{flex:1;font-size:.78rem;color:var(--text2);}
.song-empty{font-size:.74rem;color:var(--text3);font-style:italic;padding:4px 0;}
.admin-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.2),transparent);margin:14px 0;}

/* ─── PHASE BAR ────────────────────────────────── */
.phase-bar{display:flex;align-items:center;gap:14px;font-family:'Cinzel',serif;font-size:clamp(.72rem,1vw,.92rem);letter-spacing:.18em;text-transform:uppercase;color:var(--text3);}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--surface3);border:1px solid var(--border2);transition:all .35s;flex-shrink:0;}
.pdot.active{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(201,168,76,.7);}
.pdot.done{background:var(--surface2);border-color:var(--gold);position:relative;}
.pdot.done::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.44rem;color:var(--gold);}

/* ─── WHEELS STAGE ─────────────────────────────── */
.wheels-stage{
  display:flex;align-items:flex-start;justify-content:center;
  gap:clamp(16px,3vw,56px);flex-wrap:nowrap;width:100%;
  overflow:visible;
}
/* Both wheel columns start at same top edge */
.wheel-unit{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;}

.wheel-unit-lbl{
  font-family:'Cinzel',serif;font-size:clamp(.8rem,1.1vw,1rem);
  letter-spacing:.24em;text-transform:uppercase;color:var(--text3);
}

/* ─── BULBS ────────────────────────────────────── */
.drum-shell{position:relative;display:flex;align-items:center;}
.bulb-strip{
  display:flex;flex-direction:column;justify-content:space-around;align-items:center;
  width:26px;height:calc(var(--slot-h)*var(--vis));
}
.bulb{width:11px;height:11px;border-radius:50%;background:#12120a;border:1px solid rgba(201,168,76,.22);transition:background .07s,box-shadow .07s;}
.bulb.lit{background:var(--gold3);border-color:var(--gold);box-shadow:0 0 8px 2px rgba(245,223,144,.72);}

/* ─── DRUM ─────────────────────────────────────── */
.drum-outer{
  width:var(--drum-w);height:calc(var(--slot-h)*var(--vis));
  position:relative;border-radius:12px;background:#080806;
  border:2px solid var(--border3);
  box-shadow:inset 0 0 50px rgba(0,0,0,.9),0 0 0 1px rgba(201,168,76,.06),0 8px 50px rgba(0,0,0,.7);
  overflow:hidden;
}
.drum-outer::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);z-index:8;}
.drum-outer::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);z-index:8;}
.drum-clip{width:100%;height:100%;overflow:hidden;border-radius:10px;position:relative;}
.drum{display:flex;flex-direction:column;will-change:transform;}

.drum-slot{
  width:var(--drum-w);height:var(--slot-h);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  padding:6px 16px;font-family:'Cinzel',serif;
  font-size:clamp(1.05rem,1.6vw,1.35rem);
  letter-spacing:.04em;text-align:center;line-height:1.3;
  border-bottom:1px solid rgba(201,168,76,.05);
  position:relative;overflow:hidden;
}
.drum-slot.dk{background:linear-gradient(135deg,#0e0e08,#141408);}
.drum-slot.gd{background:linear-gradient(135deg,#1c1700,#231d00);}
.drum-slot::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.025) 0%,transparent 50%);pointer-events:none;}

.drum-fade-t,.drum-fade-b{position:absolute;left:0;right:0;height:100px;z-index:5;pointer-events:none;}
.drum-fade-t{top:0;background:linear-gradient(to bottom,#080806 0%,rgba(8,8,6,0) 100%);}
.drum-fade-b{bottom:0;background:linear-gradient(to top,#080806 0%,rgba(8,8,6,0) 100%);}

.drum-win{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  height:var(--slot-h);
  border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);
  box-shadow:0 0 24px rgba(201,168,76,.3),inset 0 0 24px rgba(201,168,76,.07);
  z-index:6;pointer-events:none;
}
.drum-win::before,.drum-win::after{content:'';position:absolute;width:9px;height:9px;border-color:var(--gold3);border-style:solid;top:-1px;}
.drum-win::before{left:0;border-width:2px 0 0 2px;}
.drum-win::after{right:0;border-width:2px 2px 0 0;}

.drum-ptr{
  position:absolute;right:-32px;top:50%;transform:translateY(-50%);
  width:0;height:0;
  border-top:17px solid transparent;border-bottom:17px solid transparent;
  border-right:28px solid var(--gold2);
  filter:drop-shadow(0 0 8px rgba(232,201,106,.72));
  z-index:10;
}
.drum-lock{
  position:absolute;inset:0;background:rgba(8,8,6,.76);
  display:flex;align-items:center;justify-content:center;
  z-index:20;border-radius:10px;transition:opacity .3s;
}
.drum-lock.hidden{opacity:0;pointer-events:none;}
.lock-lbl{font-family:'Cinzel',serif;font-size:clamp(.72rem,1vw,.9rem);letter-spacing:.18em;text-transform:uppercase;color:var(--text3);text-align:center;line-height:2.4;}

.chosen-badge{
  font-family:'Cinzel',serif;font-size:clamp(.7rem,.95vw,.88rem);letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold2);background:var(--gold-dim);border:1px solid var(--border2);
  border-radius:20px;padding:5px 18px;
  opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s;
  height:30px;display:flex;align-items:center;white-space:nowrap;
  position:absolute;top:-38px;left:50%;translate:-50% 0;
}
.chosen-badge.vis{opacity:1;transform:translateY(0);}

/* ─── SPIN BUTTONS ─────────────────────────────── */
.spin-btn{
  background:linear-gradient(135deg,#1e1800,#2e2400 50%,#1e1800);
  color:var(--gold2);border:1px solid var(--border3);border-radius:60px;
  font-family:'Cinzel',serif;font-size:clamp(.9rem,1.3vw,1.1rem);font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;
  padding:clamp(15px,1.8vh,22px) clamp(36px,4vw,60px);
  cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 2px 30px rgba(201,168,76,.16),inset 0 1px 0 rgba(201,168,76,.18);
  transition:all .2s;
}
.spin-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(245,223,144,.07) 0%,transparent 50%);pointer-events:none;}
.spin-btn:not(:disabled):hover{background:linear-gradient(135deg,#2a2000,#3e3200 50%,#2a2000);box-shadow:0 4px 44px rgba(201,168,76,.38),inset 0 1px 0 rgba(201,168,76,.28);transform:translateY(-2px);}
.spin-btn:not(:disabled):active{transform:translateY(1px);}
.spin-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}

.spin-again-btn{
  position:fixed;bottom:clamp(28px,5vh,52px);left:50%;transform:translateX(-50%) translateY(30px);
  opacity:0;pointer-events:none;
  background:linear-gradient(135deg,#1e1800,#2e2400 50%,#1e1800);
  color:var(--gold2);border:1px solid var(--border3);border-radius:60px;
  font-family:'Cinzel',serif;font-size:clamp(.82rem,1.1vw,1rem);font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;
  padding:clamp(13px,1.6vh,18px) clamp(38px,5vw,64px);
  cursor:pointer;
  box-shadow:0 4px 40px rgba(201,168,76,.28),inset 0 1px 0 rgba(201,168,76,.18);
  transition:opacity .4s .2s ease, transform .4s .2s cubic-bezier(.22,1,.36,1), background .2s, box-shadow .2s;
  z-index:101;
  white-space:nowrap;
}
.spin-again-btn.vis{
  opacity:1;pointer-events:auto;
  transform:translateX(-50%) translateY(0);
}
.spin-again-btn:hover{
  background:linear-gradient(135deg,#2a2000,#3e3200 50%,#2a2000);
  box-shadow:0 6px 50px rgba(201,168,76,.45),inset 0 1px 0 rgba(201,168,76,.28);
}
.spin-again-btn:active{transform:translateX(-50%) scale(.97);}

/* ─── RESULT CARD ──────────────────────────────── */
.result-reveal{
  position:fixed;
  inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;
  pointer-events:none;
  opacity:0;
  transition:opacity .45s cubic-bezier(.22,1,.36,1);
}
.result-reveal::before{
  content:'';position:absolute;inset:0;
  background:rgba(8,8,6,.82);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.result-reveal.vis{
  opacity:1;pointer-events:auto;
}
.result-card-wrap{
  position:relative;z-index:1;
  width:90%;max-width:720px;
  transform:scale(.88) translateY(24px);
  transition:transform .5s cubic-bezier(.22,1,.36,1);
}
.result-reveal.vis .result-card-wrap{
  transform:scale(1) translateY(0);
}
@keyframes revealIn{from{opacity:0;transform:scale(.9) translateY(14px);}to{opacity:1;transform:scale(1) translateY(0);}}
.result-card{
  background:linear-gradient(135deg,#16130a,#0d0b04);
  border:1px solid var(--border3);border-radius:20px;
  padding:clamp(22px,3vh,38px) clamp(28px,4vw,52px);text-align:center;
  box-shadow:0 0 70px rgba(201,168,76,.14),0 0 0 1px rgba(201,168,76,.05);
  position:relative;overflow:hidden;
}
.result-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,.05) 0%,transparent 55%);pointer-events:none;}
.result-eyebrow{font-family:'Cinzel',serif;font-size:clamp(.72rem,1vw,.9rem);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:12px;}
.result-eyebrow::before,.result-eyebrow::after{content:'◆';font-size:.4rem;opacity:.6;}
.result-cols{display:flex;align-items:center;justify-content:center;gap:32px;flex-wrap:wrap;}
.result-row{flex:1;min-width:160px;}
.result-lbl{font-family:'Cinzel',serif;font-size:clamp(.7rem,.95vw,.88rem);letter-spacing:.22em;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
.result-val{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.8rem,3.5vw,3rem);letter-spacing:.06em;background:var(--gold-shine);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.result-vsep{width:1px;height:64px;background:linear-gradient(to bottom,transparent,rgba(201,168,76,.3),transparent);flex-shrink:0;}

/* ─── FULLSCREEN TWEAKS ────────────────────────── */
:fullscreen body, :-webkit-full-screen body{overflow:hidden;}
:fullscreen .top-bar, :-webkit-full-screen .top-bar{padding:22px 40px 0;}
:fullscreen .stage, :-webkit-full-screen .stage{padding:16px 40px 24px;}

/* hide admin in fullscreen */
:fullscreen .admin-panel, :-webkit-full-screen .admin-panel{display:none!important;}
:fullscreen .tbbtn:not(.fs-btn), :-webkit-full-screen .tbbtn:not(.fs-btn){display:none;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,.2);border-radius:3px;}
</style>
</head>
<body>

<!-- Spin Again — fixed bottom-center -->
<button class="spin-again-btn" id="spinAgainBtn" onclick="resetGame()">↺ &nbsp; Spin Again</button>

<!-- ═══ TOP BAR ══════════════════════════════════════ -->
<div class="top-bar">
  <div class="top-bar-left">
    <div id="logoImgWrap">
      <img id="logoImg" class="logo-img" src="" alt="Logo"
           onerror="this.style.display='none';document.getElementById('logoPlaceholder').style.display='flex';"
           style="display:none;">
      <div id="logoPlaceholder" class="logo-img-placeholder" style="display:flex;" title="Set LOGO_URL in script to display logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </div>
    </div>
    <div class="brand-block">
      <div class="brand-publisher"><span class="bp-name">Belladonna </span><span class="bp-accent">Games</span></div>
      <div class="logo-text" id="logoArea">Karaoke Roulette</div>
    </div>
    <div class="logo-divider"></div>
    <div class="logo-sub-text">Spin Your Fate<br>Claim Your Stage</div>
  </div>
  <div class="top-bar-right">
    <span id="syncStatus" style="font-family:'DM Sans',sans-serif;font-size:.65rem;letter-spacing:.06em;color:#c9a84c;opacity:.8;white-space:nowrap;">⬤ Loading…</span>
    <button class="tbbtn" onclick="toggleAdmin()" id="adminToggleBtn">⚙ Admin</button>

/* Write to Firestore AND keep localStorage as fast cache */
async function saveData() {
  const payload = { cats, songMap };

    setSyncStatus('ok');
  } catch(e) {

/* Initial load: try Firestore first, fall back to localStorage */
async function loadData() {
  setSyncStatus('loading');
  try {
    const snap = await getDoc(_docRef);
    if (snap.exists()) {
      const p = snap.data();
      if (Array.isArray(p.cats) && p.songMap) {
        cats = p.cats;

        cats.forEach(c => { if (!songMap[c]) songMap[c] = []; });
        // Update local cache
        try { localStorage.setItem('karaokeRoulette_v1', JSON.stringify({ cats, songMap })); } catch(e) {}
        setSyncStatus('ok');
        return true;
      }
    }
    // Doc doesn't exist yet — try localStorage seed
    setSyncStatus('ok');
    return _loadLocal();
  } catch(e) {
    console.warn('Firestore load failed, using localStorage:', e);
    setSyncStatus('offline');
    return _loadLocal();
  }

function _loadLocal() {
  try {
    const raw = localStorage.getItem('karaokeRoulette_v1');
    if (!raw) return false;
    const p = JSON.parse(raw);
    if (!Array.isArray(p.cats) || !p.songMap) return false;
    cats = p.cats; songMap = p.songMap;
    cats.forEach(c => { if (!songMap[c]) songMap[c] = []; });
    return true;
  } catch(e) { return false; }
}

/* Real-time listener: keep all open tabs / screens in sync */
function startRealtimeSync() {
  onSnapshot(_docRef, (snap) => {
    if (!snap.exists()) return;
    const p = snap.data();
    if (!Array.isArray(p.cats) || !p.songMap) return;
    // Only apply if it differs from current state (avoid echo on our own saves)
    const cur = JSON.stringify({ cats, songMap });
    const inc = JSON.stringify({ cats: p.cats, songMap: p.songMap });
    if (cur === inc) return;
    cats    = p.cats;
    songMap = p.songMap;
    cats.forEach(c => { if (!songMap[c]) songMap[c] = []; });
    // Rebuild UI
    buildDrum(1, cats);
    if (chosenCat && !cats.includes(chosenCat)) resetPhase2();
    else if (chosenCat) buildDrum(2, songMap[chosenCat] || []);
    if (document.getElementById('adminPanel').classList.contains('open')) {
      renderAdminCatList(); renderAdminSongList();
    }
    check();
    setSyncStatus('ok');
    try { localStorage.setItem('karaokeRoulette_v1', JSON.stringify({ cats, songMap })); } catch(e) {}
  }, (err) => {
    console.warn('Firestore snapshot error:', err);
    setSyncStatus('offline');

}

/* ═══════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════ */
let cats    = [];
let songMap = {};
let phase   = 1;
let chosenCat  = null;
let spinning   = false;
let adminCatSel = null;

/* ═══════════════════════════════════════════════════════
   DRUM ENGINE
   ───────────────────────────────────────────────────────
   Approach: build a strip of REPS × n real DOM nodes.
   Animate by sliding a single CSS translateY on the strip.
   Winner = the node visually centred in the window at rest.
   We compute that purely from pixels — no modulo on
   accumulated floats, no virtual-node tricks.
   ═══════════════════════════════════════════════════════ */

const REPS   = 12;   // how many full copies of the list we pre-render
const VIS    = 7;    // visible slots — must match --vis CSS var
const BULBS  = 11;
// Read actual rendered slot height from a real drum-slot element
function getSlotH() {
  const slot = document.querySelector('.drum-slot');
  if (slot) return slot.getBoundingClientRect().height;
  // Fallback: parse --slot-h CSS var (works when value is plain px)
  const raw = getComputedStyle(document.documentElement).getPropertyValue('--slot-h').trim();
  const px  = parseFloat(raw);
  return isNaN(px) ? 72 : px;
}

// Per-drum state: current translateY of the strip (negative = scrolled down)
const drumY = { 1: 0, 2: 0 };
let   animId = null;

/* Build the DOM strip for drum n using items[] */
function buildDrum(n, items) {
  drumY[n] = 0;
  const strip = document.getElementById('drum' + n);
  strip.innerHTML = '';
  strip.style.transform = 'translateY(0px)';

  mkBulbs('b' + n + 'L');
  mkBulbs('b' + n + 'R');

  if (!items || !items.length) {
    // Show placeholder slots
    for (let i = 0; i < VIS; i++) {
      const s = document.createElement('div');
      s.className = 'drum-slot ' + (i % 2 ? 'gd' : 'dk');
      s.style.color = 'var(--text3)';
      s.textContent = '—';
      strip.appendChild(s);
    }
    return;
  }

  // Build REPS copies so there is plenty of strip to scroll through
  for (let r = 0; r < REPS; r++) {
    items.forEach((item, si) => {
      const s = document.createElement('div');
      s.className = 'drum-slot ' + (si % 2 ? 'gd' : 'dk');
      s.textContent = item;
      strip.appendChild(s);
    });
  }

  // Start the strip so the MIDDLE of the visible window shows items[0]
  // The centre row index (0-based from top of strip) = Math.floor(VIS/2)
  // We want strip top to be above the drum-clip by that many rows
  const startY = -Math.floor(VIS / 2) * getSlotH();
  drumY[n] = startY;
  strip.style.transform = `translateY(${startY}px)`;
}

/* Given the current translateY of strip n, which item index is centred? */
function centredIndex(n, items, slotH) {
  if (!slotH) slotH = getSlotH();
  const centrePixel  = -drumY[n] + Math.floor(VIS / 2) * slotH;
  const absoluteSlot = Math.round(centrePixel / slotH);
  return ((absoluteSlot % items.length) + items.length) % items.length;
}

/* Spin drum n; call cb(winnerIndex) when done */
function spinDrum(n, items, cb) {
  if (animId) cancelAnimationFrame(animId);

  const strip   = document.getElementById('drum' + n);
  const count   = items.length;
  const winIdx  = Math.floor(Math.random() * count);

  // Current absolute slot at centre
  const slotH = getSlotH();
  const centrePixel   = -drumY[n] + Math.floor(VIS / 2) * slotH;
  const currentSlot   = Math.round(centrePixel / slotH);

  // Target absolute slot: go forward enough full loops, then land on winIdx
  // We want target such that target % count === winIdx
  const loops         = 6 + Math.floor(Math.random() * 3);  // 6–8 full rotations
  // Next occurrence of winIdx after (currentSlot + loops*count)
  const baseSlot      = currentSlot + loops * count;
  // How many more steps from baseSlot to reach winIdx?
  const baseIdx       = ((baseSlot % count) + count) % count;
  let   extra         = (winIdx - baseIdx + count) % count;
  const targetSlot    = baseSlot + extra;

  // Convert target slot to target translateY
  const targetY = -(targetSlot * slotH - Math.floor(VIS / 2) * slotH);

  const startY  = drumY[n];
  const dist    = targetY - startY;   // will be negative (strip moves up)
  const dur     = 4000 + Math.random() * 800;  // 4.0–4.8 s
  const t0      = performance.now();

  // Smooth ease: accelerate for first 30%, then decelerate gradually for 70%
  function ease(t) {
    if (t < 0.3) {
      // Ease in: quadratic acceleration
      return (t / 0.3) * (t / 0.3) * 0.35;
    }
    // Ease out: smooth cubic deceleration for remaining 70%
    const t2 = (t - 0.3) / 0.7;
    return 0.35 + 0.65 * (1 - Math.pow(1 - t2, 3));
  }

  startBulbs();

  function frame(now) {
    const t   = Math.min((now - t0) / dur, 1);
    const y   = startY + dist * ease(t);
    drumY[n]  = y;
    strip.style.transform = `translateY(${y}px)`;

    if (t < 1) {
      animId = requestAnimationFrame(frame);
    } else {
      // Snap exactly to target
      drumY[n] = targetY;
      strip.style.transform = `translateY(${targetY}px)`;
      animId = null;
      stopBulbs();

      // Read winner directly: centred item at targetY (use same slotH as spin)
      const landed = centredIndex(n, items, slotH);
      cb(landed);
    }
  }

  animId = requestAnimationFrame(frame);
}

/* ═══════════════════════════════════════════════════════
   SPIN ENTRY POINTS
   ═══════════════════════════════════════════════════════ */
function spinWheel(n) {
  if (spinning) return;
  const items = n === 1 ? cats : (songMap[chosenCat] || []);
  if (!items.length || (n === 1 && items.length < 2)) return;

  if (n === 1) {
    document.getElementById('resultReveal').classList.remove('vis');
    document.getElementById('spinAgainBtn').classList.remove('vis');
  }

  spinning = true;
  check();

  spinDrum(n, items, (winnerIdx) => {
    spinning = false;
    if (n === 1) {
      chosenCat = items[winnerIdx];
      unlockW2();
    } else {
      showResult(chosenCat, items[winnerIdx]);
    }
    check();
  });
}

/* ═══════════════════════════════════════════════════════
   BULBS
   ═══════════════════════════════════════════════════════ */
function mkBulbs(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '';
  for (let i = 0; i < BULBS; i++) {
    const b = document.createElement('div');
    b.className = 'bulb';
    b.id = id + '_' + i;
    el.appendChild(b);
  }
}
let bulbTmr = null;
function startBulbs() {
  let f = 0;
  bulbTmr = setInterval(() => {
    for (let i = 0; i < BULBS; i++) {
      const lit = (i + f) % 2 === 0;
      ['b1L','b1R','b2L','b2R'].forEach(p => {
        const b = document.getElementById(p + '_' + i);
        if (b) b.classList.toggle('lit', lit);
      });
    }
    f++;
  }, 80);
}
function stopBulbs() {
  if (bulbTmr) { clearInterval(bulbTmr); bulbTmr = null; }
  document.querySelectorAll('.bulb').forEach(b => b.classList.remove('lit'));
}
function flashAllBulbs() {
  document.querySelectorAll('.bulb').forEach(b => b.classList.add('lit'));
  setTimeout(() => document.querySelectorAll('.bulb').forEach(b => b.classList.remove('lit')), 1400);
}

/* ═══════════════════════════════════════════════════════
   PHASE MANAGEMENT
   ═══════════════════════════════════════════════════════ */
function unlockW2() {
  phase = 2;
  document.getElementById('pd1').className = 'pdot done';
  document.getElementById('pd2').className = 'pdot active';
  buildDrum(2, songMap[chosenCat] || []);
  const b = document.getElementById('chosenBadge');
  b.textContent = 'Category: ' + chosenCat;
  b.classList.add('vis');
  document.getElementById('dlock').classList.add('hidden');
  check();
}
function resetPhase2() {
  phase = 1; chosenCat = null;
  document.getElementById('pd1').className = 'pdot active';
  document.getElementById('pd2').className = 'pdot';
  document.getElementById('chosenBadge').classList.remove('vis');
  document.getElementById('dlock').classList.remove('hidden');
  buildDrum(2, []);
}
function check() {
  document.getElementById('sb1').disabled = cats.length < 2 || spinning || phase !== 1;
  document.getElementById('sb2').disabled = !chosenCat || !(songMap[chosenCat]||[]).length || spinning || phase !== 2;
}

/* ═══════════════════════════════════════════════════════
   RESULT
   ═══════════════════════════════════════════════════════ */
function showResult(cat, song) {
  document.getElementById('rCat').textContent = cat;
  document.getElementById('rSong').textContent = song;
  const el = document.getElementById('resultReveal');
  el.classList.add('vis');
  flashAllBulbs();
  document.getElementById('spinAgainBtn').classList.add('vis');
}
function resetGame() {
  document.getElementById('resultReveal').classList.remove('vis');
  document.getElementById('spinAgainBtn').classList.remove('vis');
  resetPhase2();
  buildDrum(1, cats);
  check();
}

/* ═══════════════════════════════════════════════════════
   ADMIN PANEL
   ═══════════════════════════════════════════════════════ */
function toggleAdmin() {
  const p   = document.getElementById('adminPanel');
  const btn = document.getElementById('adminToggleBtn');
  const open = p.classList.toggle('open');
  btn.textContent = open ? '✕ Close Admin' : '⚙ Admin';
  if (open) renderAdminCatList();
}

function renderAdminCatList() {
  const el = document.getElementById('aCatList');
  if (!cats.length) { el.innerHTML = '<div class="song-empty">No categories yet.</div>'; return; }
  el.innerHTML = cats.map((c) => `
    <div class="cat-row${adminCatSel===c?' selected':''}" onclick="selectAdminCat('${esc(c)}')">
      <span class="cat-row-name">${esc(c)}</span>
      <span class="cat-count">${(songMap[c]||[]).length} songs</span>
      <button class="gbtn sm danger" onclick="event.stopPropagation();adminDelCat('${esc(c)}')">✕</button>
    </div>`).join('');
}
function selectAdminCat(cat) {
  adminCatSel = cat;
  renderAdminCatList();
  renderAdminSongList();
}
function renderAdminSongList() {
  const head = document.getElementById('songEditorHead');
  const list = document.getElementById('aSongList');
  if (!adminCatSel) { head.innerHTML = '← Select a category'; list.innerHTML = ''; return; }
  head.innerHTML = `Songs for <span>${esc(adminCatSel)}</span>`;
  const songs = songMap[adminCatSel] || [];
  if (!songs.length) { list.innerHTML = '<div class="song-empty">No songs yet — add one above.</div>'; return; }
  list.innerHTML = songs.map((s, i) => `
    <div class="song-row">
      <span class="song-row-name">${esc(s)}</span>
      <button class="gbtn sm danger" onclick="adminDelSong('${esc(adminCatSel)}',${i})">✕</button>
    </div>`).join('');
}

function adminAddCat() {
  const inp = document.getElementById('aCatInput');
  const v = inp.value.trim();
  if (!v || cats.includes(v)) { inp.focus(); return; }
  cats.push(v); songMap[v] = [];
  adminCatSel = v;
  inp.value = ''; inp.focus();
  renderAdminCatList(); renderAdminSongList();
  buildDrum(1, cats); saveData(); check();
}
document.getElementById('aCatInput').addEventListener('keydown', e => { if(e.key==='Enter') adminAddCat(); });

function adminDelCat(cat) {
  cats = cats.filter(c => c !== cat);
  delete songMap[cat];
  if (adminCatSel === cat) adminCatSel = cats[0] || null;
  renderAdminCatList(); renderAdminSongList();
  buildDrum(1, cats);
  if (chosenCat === cat) resetPhase2();
  saveData(); check();
}

function adminAddSong() {
  if (!adminCatSel) return;
  const inp = document.getElementById('aSongInput');
  const v = inp.value.trim();
  if (!v) { inp.focus(); return; }
  songMap[adminCatSel].push(v);
  inp.value = ''; inp.focus();
  renderAdminCatList(); renderAdminSongList();
  if (chosenCat === adminCatSel) buildDrum(2, songMap[adminCatSel]);
  saveData(); check();
}
document.getElementById('aSongInput').addEventListener('keydown', e => { if(e.key==='Enter') adminAddSong(); });

function adminDelSong(cat, i) {
  songMap[cat].splice(i, 1);
  renderAdminCatList(); renderAdminSongList();
  if (chosenCat === cat) buildDrum(2, songMap[cat]);
  saveData(); check();
}

/* ═══════════════════════════════════════════════════════
   EXPORT — bake current cats/songMap into the HTML file
   ═══════════════════════════════════════════════════════ */
function exportHTML() {
  const btn = document.getElementById('exportBtn');
  btn.textContent = '⏳ Preparing…';
  btn.disabled = true;

  // Build a clean DATA object literal string from current state
  const lines = ['const DATA = {'];
  cats.forEach((cat, ci) => {
    const songs = songMap[cat] || [];
    const escapedCat = cat.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    lines.push(`  '${escapedCat}': [`);
    songs.forEach(song => {
      const escapedSong = song.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
      lines.push(`    "${escapedSong}",`);
    });
    lines.push(`  ]${ci < cats.length - 1 ? ',' : ''}`);
  });
  lines.push('};');
  const newDataBlock = lines.join('\n');

  // Replace the DATA block in the page's own source HTML
  const html = document.documentElement.outerHTML;
  // Match from `const DATA = {` to the closing `};` of that block
  const updated = html.replace(/const DATA = \{[\s\S]*?\};/, newDataBlock);

  if (updated === html) {
    btn.textContent = '⚠ Export failed — pattern not found';
    btn.disabled = false;
    return;
  }

  // Trigger download
  const blob = new Blob(['<!DOCTYPE html>\n' + updated], { type: 'text/html' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'karaoke-roulette.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  btn.innerHTML = '✓ Downloaded!';
  setTimeout(() => {
    btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export — Save to File';
    btn.disabled = false;
  }, 2500);
}

/* ═══════════════════════════════════════════════════════
   UTIL
   ═══════════════════════════════════════════════════════ */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ═══════════════════════════════════════════════════════
   EXPOSE to window (required because script is type=module)
   ═══════════════════════════════════════════════════════ */
window.spinWheel      = spinWheel;
window.resetGame      = resetGame;
window.toggleAdmin    = toggleAdmin;
window.toggleFullscreen = toggleFullscreen;
window.adminAddCat    = adminAddCat;
window.adminAddSong   = adminAddSong;
window.adminDelCat    = adminDelCat;
window.adminDelSong   = adminDelSong;
window.selectAdminCat = selectAdminCat;
window.exportHTML     = exportHTML;

/* ═══════════════════════════════════════════════════════
   INIT  (async — waits for Firestore before rendering)
   ═══════════════════════════════════════════════════════ */
(async () => {
  const loaded = await loadData();
  if (!loaded) {
    cats = Object.keys(DATA);
    cats.forEach(c => songMap[c] = [...DATA[c]]);
  }
  mkBulbs('b1L'); mkBulbs('b1R');
  mkBulbs('b2L'); mkBulbs('b2R');
  buildDrum(1, cats);
  buildDrum(2, []);
  check();
  startRealtimeSync();
})();

/* ─── FULLSCREEN ─────────────────────────────────── */
function toggleFullscreen() {
  const btn = document.getElementById('fsBtn');
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

function onFsChange() {
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  const btn  = document.getElementById('fsBtn');
  btn.textContent = isFs ? '✕ Exit Fullscreen' : '⛶ Fullscreen';
  document.documentElement.classList.toggle('fs', isFs);
  buildDrum(1, cats);
  const d2items = chosenCat ? (songMap[chosenCat] || []) : [];
  buildDrum(2, d2items);
  if (phase === 2) {
    document.getElementById('dlock').classList.add('hidden');
    document.getElementById('chosenBadge').classList.add('vis');
  }
}

document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
document.addEventListener('dblclick', (e) => {
  if (['BUTTON','INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  toggleFullscreen();
});
</script>
