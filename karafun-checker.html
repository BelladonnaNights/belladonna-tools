<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaraFun Song Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #e8ff47;
    --accent2: #ff5f6d;
    --accent3: #47d4ff;
    --text: #f0f0f5;
    --text-muted: #6b6b80;
    --text-dim: #3a3a50;
    --found: #3ddc84;
    --found-bg: #0d2a1a;
    --notfound: #ff5f6d;
    --notfound-bg: #2a0d12;
    --uncertain: #ffb347;
    --uncertain-bg: #2a1a0d;
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated noise/scanline background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.012) 2px,
      rgba(255,255,255,0.012) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  .stage-lights {
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: 500px;
    background: conic-gradient(
      from 200deg at 20% 0%,
      transparent 0deg,
      rgba(232, 255, 71, 0.04) 20deg,
      transparent 40deg
    ),
    conic-gradient(
      from 160deg at 50% 0%,
      transparent 0deg,
      rgba(255, 95, 109, 0.05) 25deg,
      transparent 50deg
    ),
    conic-gradient(
      from 120deg at 80% 0%,
      transparent 0deg,
      rgba(71, 212, 255, 0.04) 20deg,
      transparent 40deg
    );
    pointer-events: none;
    z-index: 0;
    animation: sway 8s ease-in-out infinite;
  }

  @keyframes sway {
    0%, 100% { transform: translateX(-50%) rotate(-2deg); }
    50% { transform: translateX(-50%) rotate(2deg); }
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeDown 0.6s ease both;
  }

  .mic-icon {
    display: inline-block;
    width: 64px;
    height: 64px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50%;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .mic-icon::after {
    content: '🎤';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    filter: grayscale(0.3);
  }

  .mic-icon .pulse-ring {
    position: absolute;
    inset: -4px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    opacity: 0;
    animation: pulse-ring 2.5s ease-out infinite;
  }

  .mic-icon .pulse-ring:nth-child(2) { animation-delay: 0.8s; }
  .mic-icon .pulse-ring:nth-child(3) { animation-delay: 1.6s; }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(42px, 8vw, 68px);
    letter-spacing: 0.04em;
    line-height: 1;
    color: var(--text);
    margin-bottom: 6px;
  }

  h1 span {
    color: var(--accent);
    position: relative;
  }

  .tagline {
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    animation: fadeUp 0.5s ease both;
  }

  .card:nth-child(2) { animation-delay: 0.1s; }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hint-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-bottom: 16px;
    font-family: 'DM Mono', monospace;
  }

  .hint-bar code {
    color: var(--accent);
    background: rgba(232, 255, 71, 0.1);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    min-height: 160px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    line-height: 1.8;
    padding: 14px 16px;
    resize: vertical;
    transition: border-color 0.2s;
    caret-color: var(--accent);
  }

  textarea:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder { color: var(--text-dim); }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  button {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    background: var(--surface2);
    color: var(--text);
    letter-spacing: 0.02em;
  }

  button:hover { background: var(--border); transform: translateY(-1px); }
  button:active { transform: translateY(0) scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-check {
    background: var(--accent);
    color: #0d0d0f;
    border-color: var(--accent);
    font-weight: 700;
    padding: 10px 28px;
    font-size: 15px;
    letter-spacing: 0.05em;
  }

  .btn-check:hover { background: #d4eb3c; border-color: #d4eb3c; box-shadow: 0 0 20px rgba(232, 255, 71, 0.3); }

  .btn-check.loading {
    background: var(--surface2);
    color: var(--text-muted);
    border-color: var(--border);
    box-shadow: none;
  }

  #statusMsg {
    font-size: 13px;
    color: var(--text-muted);
    margin-left: auto;
    font-family: 'DM Mono', monospace;
  }

  /* Progress */
  .progress-wrap {
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    margin: 16px 0 0;
    overflow: hidden;
    display: none;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    border-radius: 2px;
    transition: width 0.4s ease;
    box-shadow: 0 0 8px rgba(232, 255, 71, 0.5);
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
    display: none;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 12px;
    text-align: center;
  }

  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 0.04em;
    line-height: 1;
    color: var(--text);
  }

  .stat.s-found .stat-num { color: var(--found); }
  .stat.s-missing .stat-num { color: var(--notfound); }
  .stat.s-uncertain .stat-num { color: var(--uncertain); }

  .stat-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Results */
  .results-header {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: none;
  }

  .results-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .result-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    animation: fadeUp 0.3s ease both;
    transition: border-color 0.3s;
  }

  .result-item.r-found { border-left: 3px solid var(--found); background: var(--found-bg); }
  .result-item.r-notfound { border-left: 3px solid var(--notfound); background: var(--notfound-bg); }
  .result-item.r-uncertain { border-left: 3px solid var(--uncertain); background: var(--uncertain-bg); }
  .result-item.r-checking { opacity: 0.55; }

  .result-icon {
    flex-shrink: 0;
    font-size: 20px;
    line-height: 1.3;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-top: 3px;
  }

  .result-body { flex: 1; min-width: 0; }

  .result-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-detail {
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--accent3);
    text-decoration: none;
    margin-top: 4px;
    opacity: 0.85;
    transition: opacity 0.15s;
  }

  .result-link:hover { opacity: 1; text-decoration: underline; }

  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .badge-found { background: rgba(61, 220, 132, 0.15); color: var(--found); }
  .badge-notfound { background: rgba(255, 95, 109, 0.15); color: var(--notfound); }
  .badge-uncertain { background: rgba(255, 179, 71, 0.15); color: var(--uncertain); }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .footer a { color: var(--text-muted); text-decoration: none; }
  .footer a:hover { color: var(--accent); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  @media (max-width: 480px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .btn-row { flex-direction: column; }
    button { width: 100%; }
    #statusMsg { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="stage-lights"></div>

<div class="wrapper">

  <div class="header">
    <div class="mic-icon">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
    </div>
    <h1>KARAFUN<br><span>SONG CHECKER</span></h1>
    <p class="tagline">Verify your roulette list before the party starts</p>
  </div>

  <div class="card">
    <div class="hint-bar">
      One song per line &nbsp;·&nbsp; Format: <code>Artist - Song Title</code> or just <code>Song Title</code> &nbsp;·&nbsp; Max 20 songs
    </div>
    <label for="songInput">Your song list</label>
    <textarea id="songInput" placeholder="Journey - Don't Stop Believin'&#10;Bohemian Rhapsody&#10;Adele - Rolling in the Deep&#10;Whitney Houston - I Will Always Love You&#10;Sweet Caroline"></textarea>
    <div class="btn-row">
      <button class="btn-check" id="checkBtn" onclick="startCheck()">▶ Check Songs</button>
      <button onclick="loadExample()">Load Examples</button>
      <button onclick="clearAll()">Clear</button>
      <span id="statusMsg"></span>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-fill" id="progressBar" style="width:0%"></div>
    </div>
  </div>

  <div class="stats-grid" id="statsGrid">
    <div class="stat">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat s-found">
      <div class="stat-num" id="statFound">0</div>
      <div class="stat-label">Found</div>
    </div>
    <div class="stat s-missing">
      <div class="stat-num" id="statMissing">0</div>
      <div class="stat-label">Missing</div>
    </div>
    <div class="stat s-uncertain">
      <div class="stat-num" id="statUncertain">0</div>
      <div class="stat-label">Uncertain</div>
    </div>
  </div>

  <div class="results-header" id="resultsHeader">Results</div>
  <div class="results-list" id="resultsList"></div>

  <div class="footer">
    <a href="https://www.karafun.com/karaoke/" target="_blank">Browse the full KaraFun catalog ↗</a>
    &nbsp;&nbsp;·&nbsp;&nbsp;
    <a href="https://www.karafun.com/karaoke-song-list.html" target="_blank">Download CSV catalog ↗</a>
  </div>

</div>

<script>
let checking = false;
let results = [];

function loadExample() {
  document.getElementById('songInput').value = `Journey - Don't Stop Believin'
Queen - Bohemian Rhapsody
Adele - Rolling in the Deep
Whitney Houston - I Will Always Love You
Neil Diamond - Sweet Caroline
Bon Jovi - Livin' on a Prayer
ABBA - Dancing Queen
The Killers - Mr. Brightside
Rick Astley - Never Gonna Give You Up
Total Eclipse of the Heart`;
}

function clearAll() {
  document.getElementById('songInput').value = '';
  document.getElementById('resultsList').innerHTML = '';
  document.getElementById('resultsHeader').style.display = 'none';
  document.getElementById('statsGrid').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('statusMsg').textContent = '';
  results = [];
}

function parseSongs(text) {
  return text.split('\n').map(l => l.trim()).filter(l => l.length > 0).slice(0, 20);
}

function updateStats() {
  const found = results.filter(r => r.status === 'found').length;
  const missing = results.filter(r => r.status === 'notfound').length;
  const uncertain = results.filter(r => r.status === 'uncertain').length;
  document.getElementById('statTotal').textContent = results.length;
  document.getElementById('statFound').textContent = found;
  document.getElementById('statMissing').textContent = missing;
  document.getElementById('statUncertain').textContent = uncertain;
}

function addPendingItem(song, index) {
  const div = document.createElement('div');
  div.id = 'result-' + index;
  div.className = 'result-item r-checking';
  div.innerHTML = `
    <div class="result-icon"><div class="spinner"></div></div>
    <div class="result-body">
      <div class="result-title">${escapeHtml(song)}</div>
      <div class="result-detail">Checking catalog…</div>
    </div>`;
  document.getElementById('resultsList').appendChild(div);
}

function renderItem(song, status, detail, link, index) {
  const el = document.getElementById('result-' + index);
  if (!el) return;
  const icons = { found: '✅', notfound: '❌', uncertain: '⚠️' };
  const classes = { found: 'r-found', notfound: 'r-notfound', uncertain: 'r-uncertain' };
  const badges = { found: 'Available', notfound: 'Not found', uncertain: 'Uncertain' };
  const badgeClasses = { found: 'badge-found', notfound: 'badge-notfound', uncertain: 'badge-uncertain' };
  el.className = 'result-item ' + (classes[status] || '');
  el.innerHTML = `
    <div class="result-icon">${icons[status] || '❓'}</div>
    <div class="result-body">
      <div class="result-title">${escapeHtml(song)}<span class="badge ${badgeClasses[status] || ''}">${badges[status] || ''}</span></div>
      ${detail ? `<div class="result-detail">${escapeHtml(detail)}</div>` : ''}
      ${link ? `<a class="result-link" href="${link}" target="_blank">↗ View on KaraFun</a>` : ''}
    </div>`;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function checkSong(song) {
  const prompt = `Check if the song "${song}" is available in the KaraFun karaoke catalog at karafun.com.
Search for it on https://www.karafun.com/karaoke/ and return ONLY a JSON object with these fields:
- status: "found", "notfound", or "uncertain"
- detail: a brief note (e.g. "Available as 'Don't Stop Believin\\'' by Journey" or "Not found in catalog" or "Found multiple versions")
- url: direct karafun.com URL to the song page if found, otherwise null

Return ONLY the JSON object, no markdown, no other text.`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      tools: [{ type: 'web_search_20250305', name: 'web_search' }],
      messages: [{ role: 'user', content: prompt }]
    })
  });

  if (!resp.ok) throw new Error('API error ' + resp.status);
  const data = await resp.json();
  const textBlock = data.content && data.content.find(b => b.type === 'text');
  if (!textBlock) return { status: 'uncertain', detail: 'No response from API', url: null };

  try {
    const cleaned = textBlock.text.replace(/```json|```/g, '').trim();
    const start = cleaned.indexOf('{');
    const end = cleaned.lastIndexOf('}');
    return JSON.parse(cleaned.slice(start, end + 1));
  } catch {
    const t = textBlock.text.toLowerCase();
    if (t.includes('not found') || t.includes('not available')) return { status: 'notfound', detail: 'Not found in KaraFun catalog', url: null };
    if (t.includes('found') || t.includes('available')) return { status: 'found', detail: 'Found in KaraFun catalog', url: 'https://www.karafun.com/karaoke/' };
    return { status: 'uncertain', detail: textBlock.text.slice(0, 100), url: null };
  }
}

async function startCheck() {
  if (checking) return;
  const songs = parseSongs(document.getElementById('songInput').value);
  if (!songs.length) { document.getElementById('statusMsg').textContent = 'Enter at least one song.'; return; }

  checking = true;
  results = songs.map(s => ({ song: s, status: 'pending' }));
  const checkBtn = document.getElementById('checkBtn');
  checkBtn.disabled = true;
  checkBtn.classList.add('loading');
  checkBtn.textContent = '⏳ Checking…';

  document.getElementById('resultsList').innerHTML = '';
  document.getElementById('resultsHeader').style.display = 'block';
  document.getElementById('statsGrid').style.display = 'grid';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('statTotal').textContent = songs.length;
  document.getElementById('statFound').textContent = '0';
  document.getElementById('statMissing').textContent = '0';
  document.getElementById('statUncertain').textContent = '0';

  songs.forEach((s, i) => addPendingItem(s, i));

  for (let i = 0; i < songs.length; i++) {
    document.getElementById('statusMsg').textContent = `${i + 1} / ${songs.length}`;
    document.getElementById('progressBar').style.width = Math.round((i / songs.length) * 100) + '%';
    try {
      const res = await checkSong(songs[i]);
      results[i] = { song: songs[i], ...res };
      renderItem(songs[i], res.status, res.detail, res.url, i);
    } catch (e) {
      results[i] = { song: songs[i], status: 'uncertain', detail: 'Error — try again', url: null };
      renderItem(songs[i], 'uncertain', 'Error — try again', null, i);
    }
    updateStats();
  }

  document.getElementById('progressBar').style.width = '100%';
  const found = results.filter(r => r.status === 'found').length;
  document.getElementById('statusMsg').textContent = `Done! ${found}/${songs.length} found`;
  checkBtn.disabled = false;
  checkBtn.classList.remove('loading');
  checkBtn.textContent = '▶ Check Songs';
  checking = false;
}
</script>
</body>
</html>
